<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mariya Binty 💙</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#0b1e5b,#3f8cff);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:white;

}

.container{

text-align:center;

animation:fade 2s;

}

h1{

font-size:45px;

text-shadow:0 0 20px cyan;

margin-bottom:20px;

}

h2{

font-size:22px;

margin-bottom:15px;

}

p{

font-size:18px;

margin-bottom:35px;

}

button{

padding:18px 45px;

font-size:22px;

border:none;

border-radius:50px;

background:#00a2ff;

color:white;

cursor:pointer;

box-shadow:0 0 25px cyan;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<h1>🎉 Happy Birthday 🎉</h1>

<h2>MARIYA BINTY 💙</h2>

<p>A Special Surprise is waiting for you...</p>

<button onclick="openGift()">

🎁 Open Your Gift

</button>

</div>

<script>

function openGift(){

alert("Happy Birthday Mariya Binty 💙\n\nFrom FAHIM");

}

</script>

</body>

  </html>
